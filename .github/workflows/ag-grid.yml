name: AgGrid table

on:
  push:
    branches: [main]
    paths: [ag-grid/**, scripts/**, .github/workflows/ag-grid.yml]
  pull_request:
    paths: [ag-grid/**, scripts/**, .github/workflows/ag-grid.yml]

jobs:
  ag-grid:
    name: AgGrid
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-grid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run verify

  backend:
    name: AgGrid data backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-grid/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q tests
